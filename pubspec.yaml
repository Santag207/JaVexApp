name: xae_app
description: XAEApp - Xavierian Aerospace Engineering.

# Version y otros metadatos del proyecto
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.1.7
  dio: ^5.4.0
  
  # State Management - BLoC Pattern
  flutter_bloc: ^8.1.3
  bloc: ^8.1.1
  equatable: ^2.0.5
  
  # Inyección de Dependencias
  get_it: ^7.5.0
  
  # Navegación
  go_router: ^10.0.0

  # Autenticación biométrica y almacenamiento seguro
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # Backend - Supabase
  supabase_flutter: ^2.8.0

  # Tipografías y animaciones del sistema de diseño
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  table_calendar: ^3.0.6

  # Testing
  mocktail: ^1.0.0

  # Generador de iconos de launcher
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true

  # Aquí registramos la carpeta de assets
  assets:
    - assets/logo.png
    - assets/profile_picture.jpg

